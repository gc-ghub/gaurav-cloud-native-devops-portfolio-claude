# Template for a future single-domain production deployment (Phase 8+).
# NOT wired into docker-compose.yml yet — there's no real domain to point it
# at. Once one exists, run this in front of the frontend/backend containers
# so both are served from one origin (avoids needing CORS in production).
#
# Usage sketch: mount this into an nginx container on the same Docker network
# as `frontend` and `backend`, publish 80/443 from that container instead of
# from frontend/backend directly, and point DNS at it.

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
