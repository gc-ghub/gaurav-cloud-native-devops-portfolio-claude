# Serves the built SPA and proxies API calls to the backend on the same
# Docker network, so the frontend container is a single origin. This lets
# `ngrok http 8081` (or any single-port tunnel) expose the whole app without
# CORS or build-time API URL issues. See root `nginx.conf` for the separate
# future production template (frontend + backend as distinct containers).

server {
    listen 8080;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
